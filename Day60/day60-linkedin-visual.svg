    <rect x="0" y="0" width="920" height="70" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="0" y1="35" x2="920" y2="35" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="230" y1="0" x2="230" y2="70" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="460" y1="0" x2="460" y2="70" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>
    <line x1="690" y1="0" x2="690" y2="70" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Cell 1 -->
    <text x="15" y="14" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">SHEET</text>
    <text x="15" y="28" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#f97316" font-weight="700">10 / 10 · FINAL</text>
    <text x="15" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">STATUS</text>
    <text x="15" y="63" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#fbbf24" font-weight="700">SHIPPED · v1.0.0</text>

    <!-- Cell 2 -->
    <text x="245" y="14" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">PROJECT</text>
    <text x="245" y="28" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#ffffff">KICKOFF</text>
    <text x="245" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">STACK</text>
    <text x="245" y="63" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#ffffff">CF · WORKERS AI · KV</text>

    <!-- Cell 3 -->
    <text x="475" y="14" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">COST</text>
    <text x="475" y="28" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#ffffff">$0 / MO</text>
    <text x="475" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">SIGNUP</text>
    <text x="475" y="63" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#ffffff">NONE</text>

    <!-- Cell 4 -->
    <text x="705" y="14" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">CHALLENGE</text>
    <text x="705" y="28" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#ffffff">60 / 60 · COMPLETE</text>
    <text x="705" y="49" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8" fill="#ffffff" fill-opacity="0.5" letter-spacing="1">NEXT</text>
    <text x="705" y="63" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#f97316">→ DAY 61</text>
  </g>
</svg>
