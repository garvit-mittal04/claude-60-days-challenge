    <text x="80" y="895" font-size="13" letter-spacing="3" fill="#f97316">§ B · FOUR LESSONS · 60 DAYS</text>
  </g>

  <g transform="translate(80, 920)">
    <!-- Lesson 1 -->
    <g>
      <rect x="0" y="0" width="450" height="90" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
      <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#f97316" letter-spacing="2">01</text>
      <text x="18" y="55" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Non-developers can ship</text>
      <text x="18" y="75" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.7">real products now.</text>
    </g>

    <!-- Lesson 2 -->
    <g transform="translate(470, 0)">
      <rect x="0" y="0" width="450" height="90" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
      <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#f97316" letter-spacing="2">02</text>
      <text x="18" y="55" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Deploys lie.</text>
      <text x="18" y="75" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.7">Curl doesn't.</text>
    </g>

    <!-- Lesson 3 -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="450" height="90" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
      <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#f97316" letter-spacing="2">03</text>
      <text x="18" y="55" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Constraint is a design tool.</text>
      <text x="18" y="75" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.7">Not a limitation.</text>
    </g>

    <!-- Lesson 4 -->
    <g transform="translate(470, 105)">
      <rect x="0" y="0" width="450" height="90" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5"/>
      <text x="18" y="26" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#f97316" letter-spacing="2">04</text>
      <text x="18" y="55" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#ffffff">The habit compounds.</text>
      <text x="18" y="75" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.7">60 days &gt; any single skill.</text>
    </g>
  </g>

  <!-- Title block (bottom) -->
