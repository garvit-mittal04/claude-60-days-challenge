<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- Sheet 10 — Day 60: LAUNCH + GRADUATION -->

  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.08"/>
    </pattern>
    <pattern id="gridBig" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.15"/>
    </pattern>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="#0e3a5f"/>
  <rect width="1080" height="1350" fill="url(#grid)"/>
  <rect width="1080" height="1350" fill="url(#gridBig)"/>

  <!-- Outer frame -->
  <rect x="40" y="40" width="1000" height="1270" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Corner registration marks -->
  <g stroke="#f97316" stroke-width="2" fill="none">
    <path d="M 40 90 L 40 40 L 90 40"/>
    <path d="M 990 40 L 1040 40 L 1040 90"/>
    <path d="M 1040 1260 L 1040 1310 L 990 1310"/>
    <path d="M 90 1310 L 40 1310 L 40 1260"/>
  </g>
  <g fill="#f97316">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="1020" cy="60" r="3"/>
    <circle cx="1020" cy="1290" r="3"/>
    <circle cx="60" cy="1290" r="3"/>
  </g>

  <!-- Header block -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" fill="#ffffff">
    <text x="80" y="105" font-size="14" letter-spacing="4" fill-opacity="0.65">PROJECT · KICKOFF · v1.0.0</text>
    <text x="80" y="130" font-size="14" letter-spacing="4" fill-opacity="0.65">CAPSTONE · #60DAYCLAUDECHALLENGE</text>
    <text x="1000" y="105" font-size="14" letter-spacing="4" text-anchor="end" fill="#f97316">SHEET 10/10</text>
    <text x="1000" y="130" font-size="14" letter-spacing="4" text-anchor="end" fill-opacity="0.65">FINAL</text>
  </g>
  <line x1="80" y1="150" x2="1000" y2="150" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Day number -->
  <g>
    <text x="80" y="240" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" letter-spacing="8" fill="#f97316">DAY</text>
    <text x="80" y="380" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="160" font-weight="700" fill="#ffffff" letter-spacing="-3">60</text>
    <text x="275" y="380" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="46" font-weight="300" fill="#ffffff" fill-opacity="0.6">/ 60</text>
  </g>

  <!-- Graduation seal -->
  <g transform="translate(880, 300)">
    <circle cx="0" cy="0" r="90" fill="url(#seal)" stroke="#b8860b" stroke-width="4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>
    <text x="0" y="-30" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="3" fill="#ffffff">SHIPPED</text>
    <text x="0" y="10" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#ffffff">v1.0.0</text>
    <text x="0" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" letter-spacing="2" fill="#ffffff">JUL · 28 · 2026</text>
  </g>

