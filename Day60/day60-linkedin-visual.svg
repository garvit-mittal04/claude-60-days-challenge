  <g>
    <text x="80" y="470" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="60" font-weight="700" fill="#ffffff">LAUNCH + GRADUATION</text>
    <text x="80" y="510" font-family="ui-sans-serif, -apple-system, Helvetica, sans-serif" font-size="22" font-weight="300" fill="#ffffff" fill-opacity="0.7">the 60-day arc, sealed</text>
  </g>

  <line x1="80" y1="540" x2="1000" y2="540" stroke="#f97316" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Section A: The 60-day curve -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" fill="#ffffff">
    <text x="80" y="585" font-size="13" letter-spacing="3" fill="#f97316">§ A · THE COMPOUNDING CURVE</text>
  </g>

  <!-- Curve chart -->
  <g transform="translate(80, 615)">
    <!-- axes -->
    <line x1="20" y1="180" x2="900" y2="180" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="20" y1="20" x2="20" y2="180" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Fill under curve -->
    <path d="M 20 172 C 180 168, 240 158, 380 138 S 540 92, 700 58 S 850 20, 900 15 L 900 180 L 20 180 Z"
          fill="url(#curveFill)" />

    <!-- Curve line -->
    <path d="M 20 172 C 180 168, 240 158, 380 138 S 540 92, 700 58 S 850 20, 900 15"
          fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

    <!-- Milestone dots -->
    <circle cx="20" cy="172" r="5" fill="#22d3ee"/>
    <circle cx="380" cy="138" r="5" fill="#22d3ee"/>
    <circle cx="700" cy="58" r="6" fill="#f97316"/>
    <circle cx="900" cy="15" r="8" fill="#fbbf24" stroke="#0e3a5f" stroke-width="2"/>

    <!-- Milestone labels -->
    <g font-family="ui-monospace, SFMono-Regular, monospace" fill="#ffffff" font-size="11">
      <text x="20" y="200" text-anchor="middle" fill-opacity="0.7">DAY 1</text>
      <text x="380" y="200" text-anchor="middle" fill-opacity="0.7">DAY 30</text>
      <text x="700" y="200" text-anchor="middle" fill="#f97316">DAY 51</text>
      <text x="900" y="200" text-anchor="middle" fill="#fbbf24">DAY 60</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, monospace" fill="#22d3ee" font-size="10">
      <text x="20" y="160" text-anchor="start">start</text>
      <text x="380" y="126" text-anchor="middle">first real project</text>
    </g>
    <text x="700" y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" fill="#f97316">capstone start</text>
    <text x="900" y="0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#fbbf24" font-weight="700">v1.0.0 ★</text>
  </g>

