      <text x="10" y="112" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#ffffff" fill-opacity="0.6">r/analytics</text>
      <text x="10" y="128" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#ffffff" fill-opacity="0.6">dataanalysis · nonprofits</text>
